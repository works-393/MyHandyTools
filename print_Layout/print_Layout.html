<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Content Generator</title>
<style>
body {
    font-family: sans-serif;
    line-height: 1.8;
    padding: 20px;
}
.container {
    max-width: 800px;
    margin: 0 auto;
    padding: 16px;
}
label {
    font-weight: bold;
    display: block;
    margin-top: 12px;
}
input, textarea {
    width: 100%;
    margin-top: 4px;
    padding: 6px;
}
button {
    margin-top: 16px;
    padding: 10px 16px;
}
.block {
    border-top: 1px solid #ccc;
    padding-top: 16px;
    margin-top: 16px;
}
h1 {
    font-size: 30px; 
    font-weight: 600;
    text-align: center;
    margin: 6px 0;
    line-height: 1.4;
}
</style>
</head>
<body>
<div class="container">
<h1>Content create sheet</h1>

<label>h1(Title)</label>
<input id="h1">

<label>h2(Topics)</label>
<input id="h2">

<div id="blocks"></div>

<button id="add-block">+ Add another content set</button><br>
<button id="create">Create content</button>
</div>

<script>
let count = 0;

/* ① ブロック追加 */
document.getElementById('add-block').addEventListener('click', () => {
    count++;
    const div = document.createElement('div');
    div.className = 'block';
    div.innerHTML = `
        <label>h3（任意）枠外右寄せ</label>
        <input id="h3-${count}">

        <label>h4（任意・contentセンター）</label>
        <input id="h4-${count}">

        <div id="sub-${count}"></div>

        <button type="button" onclick="addSub(${count})">
            + Add content set
        </button>
    `;
    document.getElementById('blocks').appendChild(div);
});

/* + Add content set */
function addSub(parent) {
    const container = document.getElementById(`sub-${parent}`);
    const index = container.children.length + 1;

    const div = document.createElement('div');
    div.style.marginTop = '12px';
    div.innerHTML = `
        <label>h5（任意）タイトル左寄せ</label>
        <input id="h5-${parent}-${index}">

        <label>本文</label>
        <textarea id="body-${parent}-${index}" rows="4"></textarea>
    `;
    container.appendChild(div);
}

/* ③ HTML生成 */
document.getElementById('create').addEventListener('click', () => {

let html = `
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">

<title>${document.getElementById('h1').value}</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Josefin Sans', 'Noto Sans JP', serif;
    background-color: #ffffff;
    color: #313030;
    line-height: 2;
}
.container {
    max-width: 800px;
    margin: 0 auto;
    padding: 16px;
}
/* インク節約：黒背景を廃止し、黒の細い枠線に変更 */
h1 {
    background-color: #e4e2dd;
    color: #313030;
    font-size: 18px;
    font-weight: bold;
    padding: 10px;
    margin: 0 0 20px;
    border: 1px solid #313030;
    border-radius: 8px;
}
h2 {
    font-size: 18px;
    font-weight: bold;
    padding: 0 8px 2px;
    margin: 18px 0 8px;
    display: inline-block;
    border-bottom: 1px solid #ccc;
}
h3 {
    font-size: 16px;
    font-weight: 600;
    text-align: left;
    margin: 6px 0;
}
h4 {
    font-size: 16px;
    font-weight: 600;
    text-align: left;
    margin: 8px 0;
}
h5 {
    font-size: 16px;
    font-weight: 600;
    text-align: left;
    margin: 0;
}
/* インク節約：グレー背景を廃止し、グレーの細い枠線に変更 */
.content {
    background-color: transparent;
    font-size: 14px;
    padding: 12px;
    margin-bottom: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
}
</style>
</head>
<body>
<div class="container">

<h1>${document.getElementById('h1').value}</h1>
<h2>${document.getElementById('h2').value}</h2>
`;

for (let i = 1; i <= count; i++) {
    const h3 = document.getElementById(`h3-${i}`).value;
    const h4 = document.getElementById(`h4-${i}`).value;
    const sub = document.getElementById(`sub-${i}`);

    if (h3) html += `<h3>${h3}</h3>`;

    html += `<div class="content">`;

    if (h4) html += `<h4>${h4}</h4>`;

    const sets = sub.children.length;
    for (let j = 1; j <= sets; j++) {
        const h5 = document.getElementById(`h5-${i}-${j}`).value;
        const body = document
            .getElementById(`body-${i}-${j}`)
            .value.replace(/\n/g, '<br>');

        if (h5) html += `<h5>${h5}</h5>`;
        html += `${body}<br><br>`;
    }

    html += `</div>`;
}

html += `
</div>
</body>
</html>
`.trim();

/* ダウンロード処理 */
const now = new Date();
const pad = n => n.toString().padStart(2,'0');
const name = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}.html`;

const blob = new Blob([html], {type:'text/html;charset=utf-8'});
const a = document.createElement('a');
a.href = URL.createObjectURL(blob);
a.download = name;
a.click();
URL.revokeObjectURL(a.href);
});
</script>

</body>
</html>
