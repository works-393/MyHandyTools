
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">

<title>mf_print.htmlの使い方</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Josefin Sans', 'Noto Sans JP', serif;
    background-color: #ffffff;
    color: #313030;
    line-height: 2;
}
.container {
    max-width: 800px;
    margin: 0 auto;
    padding: 16px;
}
/* インク節約：黒背景を廃止し、黒の細い枠線に変更 */
h1 {
    background-color: #e4e2dd;
    color: #313030;
    font-size: 18px;
    font-weight: bold;
    padding: 10px;
    margin: 0 0 20px;
    border: 1px solid #313030;
    border-radius: 8px;
}
h2 {
    font-size: 18px;
    font-weight: bold;
    padding: 0 8px 2px;
    margin: 18px 0 8px;
    display: inline-block;
    border-bottom: 1px solid #ccc;
}
h3 {
    font-size: 16px;
    font-weight: 600;
    text-align: left;
    margin: 6px 0;
}
h4 {
    font-size: 16px;
    font-weight: 600;
    text-align: left;
    margin: 8px 0;
}
h5 {
    font-size: 16px;
    font-weight: 600;
    text-align: left;
    margin: 0;
}
/* インク節約：グレー背景を廃止し、グレーの細い枠線に変更 */
.content {
    background-color: transparent;
    font-size: 14px;
    padding: 12px;
    margin-bottom: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
}
</style>
</head>
<body>
<div class="container">

<h1>mf_print.htmlの使い方</h1>
<h2>このHTMLを使えば、100回クリックする作業が「1回の貼り付け」だけで終わるようになります。</h2>
<div class="content">マネーフォワードの一覧画面（100件表示）を開く<br>画面のどこでもいいのでクリックし、キーボードの Ctrl ＋ A（すべて選択）を押して画面を青くします。<br>そのまま Ctrl ＋ C を押して、画面のデータを丸ごとコピーします。<br>さきほど作った mf_print.html をEdgeで開きます。<br>白い大きな枠の中に、Ctrl ＋ V でドバッと貼り付けます。<br>「100件を1つのページにまとめる」 ボタンをカチッと1回押します。<br><br></div></div>
</body>
</html>
