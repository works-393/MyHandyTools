<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>CSV Text to HTML Table Converter</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f5f5f5; color: #333; }
        textarea { width: 100%; height: 200px; font-family: monospace; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-group { margin: 10px 0; }
        button { padding: 10px 20px; margin-right: 10px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; }
        button:hover { background: #0056b3; }
        button.download-btn { background: #28a745; }
        button.download-btn:hover { background: #218838; }
        /* コピーボタンの専用デザイン */
        button.copy-btn { background: #17a2b8; }
        button.copy-btn:hover { background: #138496; }
        pre { background: #fff; padding: 15px; border: 1px solid #ccc; overflow-x: auto; border-radius: 4px; max-height: 400px; }
    </style>
</head>
<body>
    <h3>① ここにテキストデータ（CSV形式）を貼り付けてください</h3>
    <textarea id="textInput" placeholder="遠鉄ストア富塚店,えんてつすとあとみつかてん,中央区富塚町209-120,053-455-0505,紙・デジタル,食品スーパー,https://entstore.co.jp"></textarea>
    
    <div class="btn-group">
        <button onclick="convertToHtmlTable()">HTMLテーブル行に変換する</button>
        <!-- コピーボタン（初期状態は非表示） -->
        <button id="copyBtn" class="copy-btn" onclick="copyHtml()" style="display:none;">HTMLをコピー</button>
        <button id="downloadBtn" class="download-btn" onclick="downloadHtml()" style="display:none;">table_rows.txtをダウンロード</button>
    </div>
    
    <h3>② 変換されたHTMLコード（tr/tdタグ）</h3>
    <pre id="htmlOutput">ここに結果が表示されます</pre>

    <script>
        let generatedHtmlString = "";

        function convertToHtmlTable() {
            const input = document.getElementById('textInput').value.trim();
            const output = document.getElementById('htmlOutput');
            const downloadBtn = document.getElementById('downloadBtn');
            const copyBtn = document.getElementById('copyBtn');
            
            if (!input) {
                output.textContent = 'データが入力されていません。';
                downloadBtn.style.display = 'none';
                copyBtn.style.display = 'none';
                return;
            }

            try {
                // 行ごとに分割
                const lines = input.split(/\r?\n/);
                let resultRows = [];

                lines.forEach(line => {
                    if (!line.trim()) return; // 空行はスキップ

                    // カンマで分割し、Excelコピペ特有の「"」を除去
                    const columns = line.split(',').map(col => col.trim().replace(/^"|"$/g, ''));

                    // データが存在する場合に処理
                    if (columns.length > 0) {
                        let rowHtml = "  <tr>\n";
                        
                        columns.forEach((col, index) => {
                            // 7番目の列（インデックス6）はHPのAタグにする
                            if (index === 6 && col.startsWith('http')) {
                                rowHtml += `    <td><a href="${col}" target="_blank">HP</a></td>\n`;
                            // 8番目の列（インデックス7）は地図のAタグにする
                            } else if (index === 7 && col.startsWith('http')) {
                                rowHtml += `    <td><a href="${col}" target="_blank">地図</a></td>\n`;
                            // それ以外の通常の列
                            } else {
                                rowHtml += `    <td>${col}</td>\n`;
                            }
                        });

                        rowHtml += "  </tr>";
                        resultRows.push(rowHtml);
                    }
                });

                if (resultRows.length === 0) {
                    output.textContent = '有効なデータ行が見つかりませんでした。カンマ区切りのデータか確認してください。';
                    downloadBtn.style.display = 'none';
                    copyBtn.style.display = 'none';
                    return;
                }

                // 行同士を改行で結合
                generatedHtmlString = resultRows.join('\n');
                output.textContent = generatedHtmlString;
                
                // ボタンを表示
                downloadBtn.style.display = 'inline-block';
                copyBtn.style.display = 'inline-block';

            } catch (e) {
                output.textContent = '変換中にエラーが発生しました。\nエラー詳細: ' + e.message;
                downloadBtn.style.display = 'none';
                copyBtn.style.display = 'none';
            }
        }

        // クリップボードにコピーする関数（元のロジックを継承）
        function copyHtml() {
            if (!generatedHtmlString) return;

            navigator.clipboard.writeText(generatedHtmlString).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                
                copyBtn.textContent = "コピーしました！";
                copyBtn.style.background = "#28a745"; // 緑色に変える
                
                setTimeout(() => {
                    copyBtn.textContent = "HTMLをコピー";
                    copyBtn.style.background = "#17a2b8"; // 元の水色に戻す
                }, 1500);
            }).catch(err => {
                alert('コピーに失敗しました: ' + err);
            });
        }

        // ダウンロード関数（txtファイルに変更）
        function downloadHtml() {
            if (!generatedHtmlString) return;
            
            const blob = new Blob([generatedHtmlString], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            
            a.href = url;
            a.download = 'table_rows.txt';
            document.body.appendChild(a);
            a.click();
            
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
